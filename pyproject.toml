[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stayline"
version = "1.0.0"
description = "Stayline Retention Intelligence — telecom subscriber attrition risk platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.vercel]
entrypoint = "src.stayline.app.api:app"
